name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Build project
        run: bun run build

  security-check:
    name: Security Scan Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve dependency audit level from policy
        id: policy
        run: |
          LEVEL="${SECURITY_DEPENDENCY_AUDIT_LEVEL:-$(jq -r '.dependencyAuditLevel // "high"' security-policy.json 2>/dev/null || echo high)}"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
        env:
          SECURITY_DEPENDENCY_AUDIT_LEVEL: ${{ vars.SECURITY_DEPENDENCY_AUDIT_LEVEL }}

      - name: Dependency vulnerability audit
        run: bun audit --audit-level=${{ steps.policy.outputs.level }}

      - name: Check for security findings
        env:
          LOVABLE_PROJECT_ID: ${{ secrets.LOVABLE_PROJECT_ID }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          LOVABLE_SECURITY_API_URL: ${{ secrets.LOVABLE_SECURITY_API_URL }}
          SECURITY_BLOCKING_LEVELS: ${{ vars.SECURITY_BLOCKING_LEVELS }}
          SECURITY_BLOCKING_SCANNERS: ${{ vars.SECURITY_BLOCKING_SCANNERS }}
          SECURITY_STRICT: ${{ vars.SECURITY_STRICT }}
        run: bun run scripts/security-check.ts
